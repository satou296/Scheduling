name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    # ubuntu-latest は予告なく新しい版に切り替わる（2026-10 に 26.04 になり、Playwright 1.56 が非対応で e2e が失敗）。
    # 版を上げるときは Playwright の対応状況を確認し、両方のジョブを同じ PR で変える
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: file:./ci.db
      SESSION_SECRET: ci-only-secret
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # キャッシュ済みの古い 22.x を使わず、毎回最新の 22.x を使う（2026-10 の証明書の問題など、セキュリティ修正を取り込むため）。
          # 最低限の版は web/package.json の engines
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7
